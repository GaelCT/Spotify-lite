[package]
name = "spotify-lite"
version = "0.1.0"
edition = "2021"
description = "A lightweight native (non-Electron) Spotify desktop client GUI"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = "0.31"
egui_extras = "0.31"
librespot = "0.8"
rspotify = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.28"
# Same crate + feature set tokio-tungstenite already builds against (see its
# Cargo.toml); needed for SinkExt::send / StreamExt::next / split. Already in
# Cargo.lock — no new transitive deps.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
debug = false
